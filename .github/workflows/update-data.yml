name: Update Pacer ETF data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      max_fetches:
        description: "Batch size; 0 is a full selected pass, positive resumes the ticker cursor; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Seconds between outgoing request starts (WAF-conservative gate); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      concurrency:
        description: "Parallel fund workers; the WAF gate stays conservative at 1; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      tickers:
        description: "Ticker allowlist separated by spaces, commas or semicolons; AND with other filters; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      aum:
        description: "Total net assets min:max; USD K/M/B/T bounds or nano/micro/small/mid/large preset; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      ter:
        description: "Total expense ratio percentage range: min:max, min:, :max, or :; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Indicated dividend-yield percentage range; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      holdings_page_size:
        description: "Rows per current-holdings JSON page; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      history_page_size:
        description: "Rows per daily market-price history JSON page; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      max_retries:
        description: "Retries after the initial request (integer >= 1); transient/network errors only; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      history_range:
        description: "Yahoo history request window: max or Ny (for example 5y); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_ytd:
        description: "YTD return range (%); annualized for 3Y+; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_1y:
        description: "1Y return range (%); annualized for 3Y+; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_3y:
        description: "3Y return range (%); annualized for 3Y+; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_5y:
        description: "5Y return range (%); annualized for 3Y+; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      performance_10y:
        description: "10Y return range (%); annualized for 3Y+; colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_ytd:
        description: "YTD cumulative total-return range (%); colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_1y:
        description: "1Y cumulative total-return range (%); colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_3y:
        description: "3Y cumulative total-return range (%); colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_5y:
        description: "5Y cumulative total-return range (%); colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      total_return_10y:
        description: "10Y cumulative total-return range (%); colon required; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      skip_yahoo:
        description: "Skip Yahoo history/dividends and retain published history; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      skip_pacer:
        description: "Skip paceretfs.com requests and use the published catalog/product data; blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      edgar_fallback:
        description: "Enable identity-verified SEC N-PORT holdings fallback (true/false); blank inherits scripts/update-data.config.json"
        required: false
        default: ""
        type: string
      advanced:
        description: 'JSON object of supported control overrides not exposed above (keys are UPPER_CASE control names, values are scalars); nonblank individual inputs win'
        required: false
        default: '{}'
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run updater unit tests
        run: bun test
      - name: Resolve file defaults and manual overrides
        env:
          DISPATCH_INPUTS: ${{ toJSON(inputs) }}
          PROTECTED_SEC_UA: ${{ vars.SEC_UA }}
        run: |
          bun --eval '
            import { resolveControls } from "./scripts/update-data.ts";
            import { appendFile } from "node:fs/promises";
            // schedule runs have no dispatch inputs: file defaults apply as-is
            const inputs = JSON.parse(process.env.DISPATCH_INPUTS || "{}");
            const advanced = JSON.parse(inputs.advanced || "{}");
            const individual = Object.fromEntries(Object.entries(inputs)
              .filter(([key]) => key !== "advanced")
              .map(([key, value]) => [key.toUpperCase(), value]));
            const file = await Bun.file("scripts/update-data.config.json").json();
            // Protected repository Actions variables: highest precedence, applied only when nonblank (never printed).
            const protectedVars = {};
            if ((process.env.PROTECTED_SEC_UA ?? "").trim()) protectedVars.SEC_UA = process.env.PROTECTED_SEC_UA.trim();
            const controls = resolveControls(file, advanced, individual, protectedVars);
            await appendFile(process.env.GITHUB_ENV,
              Object.entries(controls).map(([key, value]) => `${key}=${value}\n`).join(""));
          '
      - name: Generate api/pacer static data
        run: bun ./scripts/update-data.ts
      - name: Commit updated data
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add api/pacer
          if git diff --cached --quiet -- api/pacer; then
            echo "api/pacer is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh Pacer ETF feed"
          # Runtime-only auth; no token/header stored in URL, file or Git config.
          git -c credential.helper= -c credential.helper='!f() { if test "$1" = get; then printf "username=x-access-token\npassword=%s\n" "$GITHUB_TOKEN"; fi; }; f' push
